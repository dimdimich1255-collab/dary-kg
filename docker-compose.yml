# Запуск: docker compose up --build
#   Сайт:       http://localhost:8080
#   API и docs: http://localhost:8000/docs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dary
      POSTGRES_PASSWORD: dary
      POSTGRES_DB: dary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dary"]
      interval: 3s
      retries: 10

  backend:            # Python + FastAPI
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dary:dary@postgres:5432/dary
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      retries: 20
    ports:
      - "8000:8000"

  frontend:           # vanilla JS, раздаёт nginx
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/templates:/etc/nginx/templates:ro
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
