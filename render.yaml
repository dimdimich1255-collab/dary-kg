# Blueprint для Render: описывает сайт и базу данных, Render создаёт их сам.
# Как использовать: Render → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: dary-kg
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dary-db
          property: connectionString
      # Пароль модератора: Render придумывает его сам.
      # Прочитать: Dashboard → dary-kg → Environment → ADMIN_PASSWORD
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: IP_SALT
        generateValue: true
      # Сайт стоит за прокси Render: настоящий IP посетителя берём из X-Forwarded-For
      - key: TRUST_PROXY
        value: "1"

databases:
  - name: dary-db
    plan: free
    databaseName: dary
    user: dary
